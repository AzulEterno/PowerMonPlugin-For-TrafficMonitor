name: release-powermonplugin

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel: latest (rolling pre-release from main) or stable (versioned)'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - stable
      version:
        description: 'Release version for stable channel, e.g. v1.2.3 (ignored for latest)'
        required: false

permissions:
  contents: write

jobs:
  # Skip the build+publish when this was a plain push to main AND a tag push
  # also fires — the tag push already covers the stable path.  When the push is
  # branch-only we always produce a "latest" pre-release.
  meta:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      title: ${{ steps.resolve.outputs.title }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve release channel and version
        id: resolve
        shell: bash
        run: |
          ref="$GITHUB_REF"
          event="${{ github.event_name }}"

          if [[ "$event" == "workflow_dispatch" ]]; then
            channel="${{ github.event.inputs.channel }}"
            if [[ "$channel" == "stable" ]]; then
              v="${{ github.event.inputs.version }}"
              if [[ ! "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
                echo "::error::Invalid version '$v'. Expected SemVer like v1.2.3."
                exit 1
              fi
              echo "channel=stable" >> "$GITHUB_OUTPUT"
              echo "version=$v" >> "$GITHUB_OUTPUT"
              echo "title=PowerMon Plugin $v" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "channel=latest" >> "$GITHUB_OUTPUT"
              echo "version=latest" >> "$GITHUB_OUTPUT"
              echo "title=PowerMon Plugin latest (main @ ${GITHUB_SHA:0:7})" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$ref" == refs/tags/v* ]]; then
            v="${ref#refs/tags/}"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "title=PowerMon Plugin $v" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            # push to branch without a tag -> "latest" channel
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "title=PowerMon Plugin latest (main @ ${GITHUB_SHA:0:7})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64, ARM64EC]
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build PowerMonPlugin (Release ${{ matrix.platform }})
        run: >-
          msbuild TrafficMonitorPlugins.sln
          -t:PowerMonPlugin
          -p:Configuration=Release
          -p:Platform=${{ matrix.platform }}
          -m

      - uses: actions/upload-artifact@v4
        with:
          name: PowerMonPlugin-Release-${{ matrix.platform }}
          path: |
            bin/PowerMonPlugin/Release/${{ matrix.platform }}/*.dll
          if-no-files-found: warn

  publish:
    needs: [meta, build]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: PowerMonPlugin-Release-*
          path: staged

      - name: Package release assets + SHA256SUMS.txt
        id: package
        shell: pwsh
        run: |
          $version = '${{ needs.meta.outputs.version }}'
          $releaseDir = "release/$version"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          $installText = @(
            'Installation',
            '============',
            'Copy PowerMonPlugin.dll to TrafficMonitor\plugins.',
            'Copy LibreHardwareMonitorLib.dll next to TrafficMonitor.exe, not to plugins.',
            'Restart TrafficMonitor and check More Functions > Plugin Management.'
          ) -join "`r`n"

          $assets = [System.Collections.Generic.List[string]]::new()

          foreach ($platform in @('x64','ARM64','ARM64EC')) {
            $src = "staged/PowerMonPlugin-Release-$platform"
            if (-not (Test-Path $src)) { throw "Missing artifact for $platform" }

            $pkg = "$releaseDir/PowerMonPlugin-$version-$platform"
            New-Item -ItemType Directory -Path $pkg -Force | Out-Null

            Copy-Item -Path "$src/*" -Destination $pkg -Force
            Copy-Item -LiteralPath 'PowerMonPlugin/lib/LibreHardwareMonitorLib.dll' -Destination $pkg
            Set-Content -LiteralPath "$pkg/INSTALL.txt" -Value $installText -Encoding utf8

            $zip = "$releaseDir/PowerMonPlugin-$version-$platform.zip"
            Compress-Archive -Path "$pkg/*" -DestinationPath $zip
            [void]$assets.Add($zip)
          }

          $sumsPath = "$releaseDir/SHA256SUMS.txt"
          $sums = foreach ($a in $assets) {
            $h = (Get-FileHash -LiteralPath $a -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $(Split-Path -Leaf $a)"
          }
          $sums | Set-Content -LiteralPath $sumsPath -Encoding ascii
          [void]$assets.Add($sumsPath)

          $delim = [System.Guid]::NewGuid().ToString()
          "assets<<$delim" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $assets -join "`n" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $delim | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version    = '${{ needs.meta.outputs.version }}'
          $title      = '${{ needs.meta.outputs.title }}'
          $prerelease = [System.Convert]::ToBoolean('${{ needs.meta.outputs.prerelease }}')
          $assetsFile = '${{ steps.package.outputs.assets }}'
          $assetList  = $assetsFile -split "`n" | Where-Object { $_ -ne '' }

          # For the rolling "latest" channel, remove any prior release+tag so
          # the new one can take its place at the current HEAD.
          if ($version -eq 'latest') {
            gh release delete latest --yes --cleanup-tag 2>$null
          }

          $extraArgs = @()
          if ($prerelease) { $extraArgs += '--prerelease' }

          gh release create $version `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title $title `
            --generate-notes `
            @extraArgs `
            -- $assetList
