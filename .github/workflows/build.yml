name: build-powermonplugin

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
          - platform: ARM64
          - platform: ARM64EC

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build PowerMonPlugin (Release ${{ matrix.platform }})
        run: >-
          msbuild TrafficMonitorPlugins.sln
          -t:PowerMonPlugin
          -p:Configuration=Release
          -p:Platform=${{ matrix.platform }}
          -m

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerMonPlugin-Release-${{ matrix.platform }}
          path: |
            bin/PowerMonPlugin/Release/${{ matrix.platform }}/*.dll
          if-no-files-found: warn
