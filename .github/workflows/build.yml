name: build-powermonplugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build PowerMonPlugin (Release x64)
        run: msbuild TrafficMonitorPlugins.sln -t:PowerMonPlugin -p:Configuration=Release -p:Platform=x64 -m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerMonPlugin-Release-x64
          path: |
            bin/PowerMonPlugin/Release/x64/PowerMonPlugin.dll
            bin/PowerMonPlugin/Release/x64/PowerMonPlugin.pdb
            bin/PowerMonPlugin/Release/x64/LibreHardwareMonitorLib.dll
